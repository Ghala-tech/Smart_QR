<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Smart QR Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#423E9B; --navy-2:#54529E; --ink:#241D42; --paper:#F7F6FC; --card:#FFFFFF;
    --line:#E4E2F2; --muted:#69648C; --accent:#5E82C9; --accent-ink:#3A5CA0;
    --star:#4C326D; --new:#5E82C9; --prog:#C48A08; --resolved:#2E8B57; --closed:#5B5480; --overdue:#8B2252;
    --brand-grad: linear-gradient(135deg, #7B93D1 0%, #4C4FA0 50%, #5C3298 100%);
    --shadow: 0 1px 2px rgba(66,62,155,.08), 0 10px 28px -14px rgba(66,62,155,.35);
  }
  :root:not([data-theme="light"]){ }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#100C24; --card:#191436; --ink:#EDEBF9; --line:#2C2650; --muted:#A199C7;
      --navy:#4436A0; --navy-2:#5648B8;
    }
  }
  :root[data-theme="dark"]{
    --paper:#100C24; --card:#191436; --ink:#EDEBF9; --line:#2C2650; --muted:#A199C7;
    --navy:#4436A0; --navy-2:#5648B8;
  }
  .brand-grad{ background:var(--brand-grad); }
  html,body{ background:var(--paper); color:var(--ink); }
  body{ font-family:'IBM Plex Sans Arabic', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  .mono{ font-family:'IBM Plex Mono', monospace; direction:ltr; unicode-bidi:isolate; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:10px; padding:.65rem 1.1rem; font-weight:600; font-size:.9rem; transition:transform .08s ease, opacity .15s ease; white-space:nowrap; }
  .btn:active{ transform:scale(.98); }
  .btn-primary{ background:var(--navy); color:#fff; }
  .btn-primary:hover{ background:var(--navy-2); }
  .btn-accent{ background:var(--accent); color:#fff; }
  .btn-accent:hover{ opacity:.9; }
  .btn-ghost{ background:transparent; color:var(--ink); border:1px solid var(--line); }
  .btn-ghost:hover{ background:var(--paper); }
  .btn-danger{ background:#C0392B; color:#fff; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  input,select,textarea{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:.6rem .8rem; color:var(--ink); width:100%; font-size:.92rem; }
  input:focus,select:focus,textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  label.field-label{ font-size:.8rem; color:var(--muted); font-weight:600; margin-bottom:.3rem; display:block; }
  .chip{ display:inline-flex; align-items:center; gap:.35rem; border-radius:999px; padding:.2rem .7rem; font-size:.76rem; font-weight:700; }
  .pill-new{ background:color-mix(in srgb, var(--new) 15%, transparent); color:var(--new); }
  .pill-in_progress{ background:color-mix(in srgb, var(--prog) 18%, transparent); color:var(--prog); }
  .pill-resolved{ background:color-mix(in srgb, var(--resolved) 15%, transparent); color:var(--resolved); }
  .pill-closed{ background:color-mix(in srgb, var(--closed) 18%, transparent); color:var(--closed); }
  .pill-overdue{ background:color-mix(in srgb, var(--overdue) 15%, transparent); color:var(--overdue); }
  .pill-low{ background:#E7ECF3; color:#4B5A70; }
  .pill-medium{ background:#FFF1D6; color:#8A5A00; }
  .pill-high{ background:#FFE2DD; color:#B23A1F; }
  .pill-urgent{ background:#FFD9D9; color:#A31414; }
  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
  .sidebar-link{ display:flex; align-items:center; gap:.65rem; padding:.6rem .85rem; border-radius:10px; color:#CBD8E8; font-size:.88rem; font-weight:500; }
  .sidebar-link:hover{ background:rgba(255,255,255,.08); color:#fff; }
  .sidebar-link.active{ background:rgba(255,255,255,.14); color:#fff; }
  .scroll-x{ overflow-x:auto; }
  table.data-table{ width:100%; border-collapse:collapse; font-size:.86rem; min-width:820px; }
  table.data-table th{ text-align:right; color:var(--muted); font-weight:600; font-size:.75rem; padding:.6rem .8rem; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.data-table td{ padding:.65rem .8rem; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.data-table tr:hover td{ background:color-mix(in srgb, var(--accent) 4%, transparent); }
  .stat-card{ padding:1.1rem 1.2rem; }
  .fade-in{ animation:fadein .35s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .toast{ position:fixed; bottom:1.1rem; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:.65rem 1.1rem; border-radius:10px; font-size:.85rem; z-index:200; box-shadow:var(--shadow); }
  .badge-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
  .timeline-dot{ width:14px; height:14px; border-radius:50%; border:3px solid var(--card); box-shadow:0 0 0 2px var(--line); }
  .timeline-dot.done{ background:var(--accent); box-shadow:0 0 0 2px var(--accent); }
  .qr-tile canvas{ display:block; margin:0 auto; }
  @media print{
    .no-print{ display:none !important; }
    body{ background:#fff; }
  }
</style>
</head>

<div id="app"></div>
<div id="toast-root"></div>

/* ---------------------------- backend API helper ------------------------ */
const API_BASE = '/api';
async function apiRequest(path, options){
  options = options || {};
  const opts = { method: options.method || 'GET', headers: {} };
  if(options.body !== undefined){
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(options.body);
  }
  let res;
  try{
    res = await fetch(API_BASE + path, opts);
  }catch(e){
    throw new Error('تعذّر الاتصال بالخادم. تحقق من الاتصال وحاول مرة أخرى.');
  }
  let data = null;
  try{ data = await res.json(); }catch(e){ data = null; }
  if(!res.ok){
    throw new Error((data && data.error) || ('خطأ في الخادم (' + res.status + ')'));
  }
  return data;
}

/* ---------------------------- utilities -------------------------------- */
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function pad(n,l){ n=String(n); while(n.length<l) n='0'+n; return n; }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('ar-SA',{year:'numeric',month:'2-digit',day:'2-digit'}) + ' ' + d.toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});
}
function fmtDateShort(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('ar-SA',{year:'numeric',month:'2-digit',day:'2-digit'});
}
function hoursBetween(a,b){ return (new Date(b) - new Date(a)) / 36e5; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast fade-in';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2200);
}

/* ---------------------------- lookups ----------------------------------- */
const PROBLEM_TYPES = [
  {key:'device', label:'أجهزة'}, {key:'ac', label:'تكييف'}, {key:'lighting', label:'إضاءة'},
  {key:'network', label:'شبكة وإنترنت'}, {key:'furniture', label:'أثاث'}, {key:'cleaning', label:'نظافة'},
  {key:'electricity', label:'كهرباء'}, {key:'plumbing', label:'سباكة'}, {key:'other', label:'أخرى'}
];
const PRIORITIES = [
  {key:'low', label:'منخفضة'}, {key:'medium', label:'متوسطة'}, {key:'high', label:'عالية'}, {key:'urgent', label:'عاجلة'}
];
const STATUSES = [
  {key:'new', label:'جديد'}, {key:'in_progress', label:'قيد التنفيذ'}, {key:'resolved', label:'تم الحل'}, {key:'closed', label:'مغلق'}
];
function typeLabel(k){ return (PROBLEM_TYPES.find(t=>t.key===k)||{}).label || k; }
function prLabel(k){ return (PRIORITIES.find(t=>t.key===k)||{}).label || k; }
function stLabel(k){ return (STATUSES.find(t=>t.key===k)||{}).label || k; }

function isOverdue(report, settings){
  if(report.status==='resolved' || report.status==='closed') return false;
  return hoursBetween(report.createdAt, new Date().toISOString()) > settings.escalationHours;
}

/* ---------------------------- DataService (backend-backed) -------------
   All read/write goes through here. Reads are synchronous against a local
   in-memory cache (`this.state`) that is hydrated once at boot from the
   real backend and refreshed after every mutation, so every existing
   Views.* render function keeps reading `DataService.state.*` exactly as
   before. Mutations are async and call the real REST API. */
const DataService = {
  state: null,

  async init(){
    const [settings, buildings, locations, devices, technicians, employees, reportsResp, notifications] = await Promise.all([
      apiRequest('/settings'),
      apiRequest('/buildings'),
      apiRequest('/locations'),
      apiRequest('/devices'),
      apiRequest('/technicians'),
      apiRequest('/employees'),
      apiRequest('/reports?all=true'),
      apiRequest('/notifications'),
    ]);
    this.state = {
      settings: {
        escalationHours: settings.escalationHours,
        facilityName: settings.facilityName,
        facilityNameEn: settings.facilityNameEn,
        notificationsEnabled: settings.notificationsEnabled,
        problemTypes: PROBLEM_TYPES,
        priorities: PRIORITIES,
      },
      admin: { email: settings.adminEmail },
      buildings, locations, devices, technicians, employees,
      reports: reportsResp.items,
      notifications,
      currentUser: this._loadSession(),
      theme: 'light',
    };
    return this.state;
  },

  // Only the logged-in user marker is kept in localStorage, purely so a
  // page refresh doesn't log the person out. This is a session convenience,
  // not a data store — all real data lives on the backend.
  _loadSession(){
    try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? (JSON.parse(raw).currentUser || null) : null; }catch(e){ return null; }
  },
  _saveSession(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({currentUser: this.state.currentUser})); }catch(e){ console.error('storage error', e); }
  },
  save(){ this._saveSession(); },

  async _refreshReports(){ const r = await apiRequest('/reports?all=true'); this.state.reports = r.items; },
  async _refreshNotifications(){ this.state.notifications = await apiRequest('/notifications'); },
  async _refreshLocations(){ this.state.locations = await apiRequest('/locations'); },
  async _refreshDevices(){ this.state.devices = await apiRequest('/devices'); },
  async _refreshBuildings(){ this.state.buildings = await apiRequest('/buildings'); },

  getLocation(id){ return this.state.locations.find(l=>l.id===id); },
  getDevice(id){ return this.state.devices.find(d=>d.id===id); },
  getBuilding(id){ return this.state.buildings.find(b=>b.id===id); },
  getTech(id){ return this.state.technicians.find(t=>t.id===id); },
  locationLabel(id){ const l=this.getLocation(id); return l ? l.name : id; },

  getReportByNumber(num){ return this.state.reports.find(r=>r.number.trim().toUpperCase()===String(num).trim().toUpperCase()); },
  getReport(id){ return this.state.reports.find(r=>r.id===id); },

  async createReport(payload){
    const rep = await apiRequest('/reports', { method:'POST', body: payload });
    await this._refreshReports();
    await this._refreshNotifications();
    return rep;
  },
  async assignTechnician(reportId, techId){
    await apiRequest('/reports/'+reportId+'/assign', { method:'PATCH', body:{ technicianId: techId } });
    await this._refreshReports();
    await this._refreshNotifications();
  },
  async setStatus(reportId, status){
    await apiRequest('/reports/'+reportId+'/status', { method:'PATCH', body:{ status } });
    await this._refreshReports();
    await this._refreshNotifications();
  },
  async addNote(reportId, text, author){
    await apiRequest('/reports/'+reportId+'/notes', { method:'POST', body:{ text, authorId: author?author.id:null, authorName: author?author.name:null } });
    await this._refreshReports();
  },
  async rateReport(reportId, rating, resolved, comment){
    await apiRequest('/reports/'+reportId+'/rating', { method:'POST', body:{ rating, resolved, comment } });
    await this._refreshReports();
  },

  async markAllNotificationsRead(){
    this.state.notifications = await apiRequest('/notifications/mark-all-read', { method:'POST' });
  },
  unreadCount(){ return this.state.notifications.filter(n=>!n.read).length; },

  async addLocation(loc){
    const created = await apiRequest('/locations', { method:'POST', body: loc });
    await this._refreshLocations();
    return created;
  },
  async addDevice(dev){
    const created = await apiRequest('/devices', { method:'POST', body: dev });
    await this._refreshDevices();
    return created;
  },
  async addBuilding(b){
    const created = await apiRequest('/buildings', { method:'POST', body: b });
    await this._refreshBuildings();
    return created;
  },
  async updateDeviceStatus(id, status){
    await apiRequest('/devices/'+id+'/status', { method:'PATCH', body:{ status } });
    await this._refreshDevices();
  },

  async saveSettings(payload){
    const updated = await apiRequest('/settings', { method:'PUT', body: payload });
    this.state.settings = {
      escalationHours: updated.escalationHours,
      facilityName: updated.facilityName,
      facilityNameEn: updated.facilityNameEn,
      notificationsEnabled: updated.notificationsEnabled,
      problemTypes: PROBLEM_TYPES,
      priorities: PRIORITIES,
    };
    this.state.admin.email = updated.adminEmail;
  },

  async staffLogin(role, id){
    const user = await apiRequest('/auth/staff-login', { method:'POST', body:{ role, id } });
    this.state.currentUser = user;
    this._saveSession();
    return user;
  },
  async adminLogin(email, password){
    const user = await apiRequest('/auth/admin-login', { method:'POST', body:{ email, password } });
    this.state.currentUser = user;
    this._saveSession();
    return user;
  },
  logout(){ this.state.currentUser = null; this._saveSession(); },

  async resetOperational(){
    await apiRequest('/admin/reset-operational', { method:'POST' });
    await this.init();
  },
};

/* ---------------------------- Router ------------------------------------ */
const Router = {
  routes: {},
  add(path, fn){ this.routes[path] = fn; },
  parse(){
    let hash = location.hash.slice(1) || '/';
    const [pathPart, queryPart] = hash.split('?');
    const parts = pathPart.split('/').filter(Boolean);
    const query = {};
    if(queryPart) queryPart.split('&').forEach(kv=>{ const [k,v]=kv.split('='); query[decodeURIComponent(k)] = decodeURIComponent(v||''); });
    return {parts, query, pathPart};
  },
  go(path){ location.hash = path; },
  render(){
    window.scrollTo(0,0);
    const {parts, query} = this.parse();
    const app = document.getElementById('app');
    app.innerHTML = '<div class="fade-in">' + View.dispatch(parts, query) + '</div>';
    View.afterRender && View.afterRender(parts, query);
  }
};
window.addEventListener('hashchange', ()=>Router.render());

function requireRole(roles){
  const u = DataService.state.currentUser;
  if(!u || !roles.includes(u.role)){
    setTimeout(()=>Router.go('/login'), 0);
    return false;
  }
  return true;
}

/* ---------------------------- View dispatcher ---------------------------- */
const View = { afterRender:null };
View.dispatch = function(parts, query){
  View.afterRender = null;
  const p0 = parts[0];
  if(!p0) return Views.landing();
  if(p0==='scan') return Views.scan();
  if(p0==='report' && parts[1]==='new') return Views.reportForm(query);
  if(p0==='success') return Views.success(parts[1]);
  if(p0==='track') return Views.track(query);
  if(p0==='rate') return Views.rate(parts[1]);
  if(p0==='login') return Views.login();

  if(p0==='employee'){
    if(!requireRole(['employee'])) return Views.redirecting();
    if(!parts[1]) return Views.employeeDashboard();
    if(parts[1]==='new') return Views.reportForm(query, true);
    if(parts[1]==='reports') return Views.employeeReports();
    if(parts[1]==='report') return Views.reportDetails(parts[2], 'employee');
  }
  if(p0==='technician'){
    if(!requireRole(['technician'])) return Views.redirecting();
    if(!parts[1]) return Views.technicianDashboard();
    if(parts[1]==='tasks') return Views.technicianTasks();
    if(parts[1]==='report') return Views.reportDetails(parts[2], 'technician');
    if(parts[1]==='notifications') return Views.notifications('technician');
  }
  if(p0==='admin'){
    if(!requireRole(['admin'])) return Views.redirecting();
    if(!parts[1]) return Views.adminDashboard();
    if(parts[1]==='reports') return Views.adminReports(query);
    if(parts[1]==='report') return Views.reportDetails(parts[2], 'admin');
    if(parts[1]==='locations') return Views.adminLocations();
    if(parts[1]==='devices') return Views.adminDevices(query);
    if(parts[1]==='qr') return Views.adminQr();
    if(parts[1]==='technicians') return Views.adminTechnicians();
    if(parts[1]==='notifications') return Views.notifications('admin');
    if(parts[1]==='analytics') return Views.adminAnalytics();
    if(parts[1]==='reports-export') return Views.adminReportsExport();
    if(parts[1]==='settings') return Views.adminSettings();
  }
  return Views.notFound();
};

let scanStream = null, scanRAF = null;
window.startScanner = async function(){
  const errEl = document.getElementById('scan-error');
  errEl.classList.add('hidden');
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    document.getElementById('scan-start-wrap').classList.add('hidden');
    document.getElementById('scan-camera-wrap').classList.remove('hidden');
    const video = document.getElementById('scan-video');
    video.srcObject = scanStream;
    await video.play();
    const canvas = document.getElementById('scan-canvas');
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    const locIds = DataService.state.locations.map(l=>l.id);
    const tick = ()=>{
      if(!scanStream) return;
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        try{
          const img = ctx.getImageData(0,0,canvas.width,canvas.height);
          const code = window.jsQR ? jsQR(img.data, img.width, img.height) : null;
          if(code && code.data){
            const raw = code.data.trim();
            // QR codes generated by this app encode a full link like
            // "<origin>/#/report/new?loc=LAB-101" so any phone camera app
            // can open them directly. Still support a bare location code
            // (e.g. typed/simulated) for backward compatibility.
            let hashPart = null;
            try{
              const u = new URL(raw);
              if(u.origin === location.origin && u.hash.startsWith('#/report/new')) hashPart = u.hash.slice(1);
            }catch(e){ /* not a URL */ }
            const bareVal = raw.toUpperCase();
            if(hashPart){
              stopScanner();
              Router.go(hashPart);
              return;
            }else if(locIds.includes(bareVal)){
              stopScanner();
              Router.go('/report/new?loc=' + bareVal);
              return;
            }else{
              document.getElementById('scan-status').textContent = 'رمز غير معروف — جرّب رمزًا آخر أو الإدخال اليدوي';
            }
          }
        }catch(e){}
      }
      scanRAF = requestAnimationFrame(tick);
    };
    scanRAF = requestAnimationFrame(tick);
  }catch(e){
    errEl.textContent = 'تعذّر الوصول إلى الكاميرا. يمكنك استخدام الإدخال اليدوي أدناه لمحاكاة المسح.';
    errEl.classList.remove('hidden');
  }
};
window.stopScanner = function(){
  if(scanRAF) cancelAnimationFrame(scanRAF);
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
  document.getElementById('scan-start-wrap') && document.getElementById('scan-start-wrap').classList.remove('hidden');
  document.getElementById('scan-camera-wrap') && document.getElementById('scan-camera-wrap').classList.add('hidden');
};
window.manualScan = function(){
  const v = document.getElementById('manual-qr-select').value;
  if(!v){ toast('الرجاء اختيار موقع'); return; }
  Router.go('/report/new?loc=' + v);
};

/* ---- Admin reports management ---- */
Views.adminReports = function(query){
  const s = DataService.state;
  let list = [...s.reports];
  const search = query.q || '';
  if(search) list = list.filter(r => r.number.toLowerCase().includes(search.toLowerCase()) || r.description.toLowerCase().includes(search.toLowerCase()));
  if(query.status) list = list.filter(r=>r.status===query.status);
  if(query.priority) list = list.filter(r=>r.priority===query.priority);
  if(query.type) list = list.filter(r=>r.type===query.type);
  if(query.loc) list = list.filter(r=>r.locationId===query.loc);
  if(query.tech) list = list.filter(r=>r.technicianId===query.tech);
  list.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));

  const page = parseInt(query.page||'1');
  const perPage = 10;
  const totalPages = Math.max(1, Math.ceil(list.length/perPage));
  const pageList = list.slice((page-1)*perPage, page*perPage);

  const qs = (overrides)=>{
    const merged = {...query, ...overrides};
    return Object.entries(merged).filter(([k,v])=>v).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&');
  };

  return dashboardLayout('admin','/admin/reports', `
  <h1 class="text-xl font-bold mb-5">إدارة البلاغات</h1>
  <div class="card p-4 mb-4">
    <div class="grid md:grid-cols-6 gap-2">
      <input id="search-input" placeholder="بحث برقم البلاغ أو الوصف" value="${escapeHtml(search)}" class="md:col-span-2 text-sm" onkeydown="if(event.key==='Enter') Router.go('/admin/reports?'+searchQS())">
      <select onchange="Router.go('/admin/reports?'+updateQS('status',this.value))" class="text-sm"><option value="">كل الحالات</option>${STATUSES.map(st=>`<option value="${st.key}" ${query.status===st.key?'selected':''}>${st.label}</option>`).join('')}</select>
      <select onchange="Router.go('/admin/reports?'+updateQS('priority',this.value))" class="text-sm"><option value="">كل الأولويات</option>${PRIORITIES.map(p=>`<option value="${p.key}" ${query.priority===p.key?'selected':''}>${p.label}</option>`).join('')}</select>
      <select onchange="Router.go('/admin/reports?'+updateQS('type',this.value))" class="text-sm"><option value="">كل الأنواع</option>${PROBLEM_TYPES.map(t=>`<option value="${t.key}" ${query.type===t.key?'selected':''}>${t.label}</option>`).join('')}</select>
      <select onchange="Router.go('/admin/reports?'+updateQS('loc',this.value))" class="text-sm"><option value="">كل المواقع</option>${s.locations.map(l=>`<option value="${l.id}" ${query.loc===l.id?'selected':''}>${l.name}</option>`).join('')}</select>
    </div>
    <div class="flex justify-between items-center mt-2">
      <button onclick="Router.go('/admin/reports?'+searchQS())" class="btn btn-primary text-xs py-1.5 px-3">${iconSvg('search','w-3.5 h-3.5')} بحث</button>
      ${(search||query.status||query.priority||query.type||query.loc) ? `<a href="#/admin/reports" class="text-xs" style="color:var(--muted)">إزالة الفلاتر</a>`:''}
    </div>
  </div>
  <p class="text-xs mb-3" style="color:var(--muted)">${list.length} نتيجة</p>
  ${Views._reportsTable(pageList, 'admin')}
  <div class="flex items-center justify-center gap-2 mt-4 text-sm">
    <button ${page<=1?'disabled':''} onclick="Router.go('/admin/reports?'+updateQS('page','${page-1}'))" class="btn btn-ghost py-1 px-3">السابق</button>
    <span style="color:var(--muted)">صفحة ${page} من ${totalPages}</span>
    <button ${page>=totalPages?'disabled':''} onclick="Router.go('/admin/reports?'+updateQS('page','${page+1}'))" class="btn btn-ghost py-1 px-3">التالي</button>
  </div>
  `);
};
window.updateQS = function(key, val){
  const {query} = Router.parse();
  const merged = {...query, [key]:val, page:key==='page'?val:'1'};
  return Object.entries(merged).filter(([k,v])=>v).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&');
};
window.searchQS = function(){
  const v = document.getElementById('search-input').value;
  return updateQS('q', v);
};

function renderQrInto(container, text, size){
  container.innerHTML = '';
  try{
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    const cellSize = size || 4;
    const html = qr.createSvgTag({cellSize, margin:2});
    container.innerHTML = html;
  }catch(e){ container.innerHTML = '<p class="text-xs text-red-500">QR error</p>'; }
}

  const s = DataService.state;

function qrTargetUrl(locId, devId){
  return location.origin + '/#/report/new?loc=' + encodeURIComponent(locId) + (devId ? '&dev=' + encodeURIComponent(devId) : '');
}
window.generateSingleQr = function(){
  const locId = document.getElementById('qr-loc').value;

  const loc = DataService.getLocation(locId);

  document.getElementById('qr-output-actions').classList.remove('hidden');
};
window.downloadQr = function(){
  const svg = document.querySelector('#qr-output svg');
  if(!svg){ toast('قم بتوليد الرمز أولًا'); return; }
  const label = document.getElementById('qr-output-sub').textContent || 'qr';
  const xml = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([xml], {type:'image/svg+xml'});
  offerDownload(blob, 'QR-' + label + '.svg');
};

function printHtml(bodyHtml){
  const w = window.open('', '_blank');
  w.document.write('<html dir="rtl"><head><title>طباعة QR</title></head><body>' + bodyHtml + '</body></html>');
  w.document.close();
  setTimeout(()=>{ w.print(); }, 300);
}
async function offerDownload(blob, filename){
  try{
    const downloads = await claude.use('downloads');
    if(downloads){
      await downloads.save({filename, data:blob});
      toast('تم حفظ الملف');
      return;
    }
  }catch(e){ /* fall through */ }
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){ toast('تعذّر تنزيل الملف'); }
}

/* ---- Analytics + Predictive Maintenance ---- */
Views.adminAnalytics = function(){
  const s = DataService.state;
  const reports = s.reports;
  // device fault counts
  const devCounts = {};
  reports.filter(r=>r.deviceId).forEach(r=>{ devCounts[r.deviceId] = (devCounts[r.deviceId]||0)+1; });
  const topDevices = Object.entries(devCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  // location counts
  const locCounts = {};
  reports.forEach(r=>{ locCounts[r.locationId] = (locCounts[r.locationId]||0)+1; });
  const topLocations = Object.entries(locCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  // type counts
  const typeCounts = {};
  reports.forEach(r=>{ typeCounts[r.type] = (typeCounts[r.type]||0)+1; });
  const topTypes = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  // avg repair time per type
  const closed = reports.filter(r=>r.closedAt);
  const repairByType = {};
  PROBLEM_TYPES.forEach(t=>{
    const rs = closed.filter(r=>r.type===t.key);
    repairByType[t.key] = rs.length ? (rs.reduce((a,r)=>a+hoursBetween(r.createdAt,r.closedAt),0)/rs.length) : null;
  });
  const closureRate = reports.length ? (closed.length/reports.length*100).toFixed(0) : 0;
  const rated = reports.filter(r=>r.rating!==null);
  const avgRating = rated.length ? (rated.reduce((a,r)=>a+r.rating,0)/rated.length).toFixed(1) : '—';

  // predictive (rule-based mock)
  const predictions = [];
  topDevices.slice(0,3).forEach(([devId, count])=>{
    if(count>=3){
      const dev = DataService.getDevice(devId);
      predictions.push(`الجهاز ${devId}${dev?(' ('+dev.name+')'):''} سجّل معدل أعطال مرتفعًا (${count} بلاغات) مقارنة بباقي الأجهزة — يُنصح بفحصه قبل حدوث عطل جديد.`);
    }
  });
  topLocations.slice(0,2).forEach(([locId, count])=>{
    if(count>=6) predictions.push(DataService.locationLabel(locId) + ' سجّل عددًا مرتفعًا من البلاغات (' + count + ') خلال الفترة الحالية.');
  });
  if(!predictions.length) predictions.push('لا توجد أنماط أعطال متكررة بارزة في البيانات الحالية.');

  return dashboardLayout('admin','/admin/analytics', `

  <p class="text-sm mb-6" style="color:var(--muted)">تحليلات قائمة على البيانات الفعلية (Rule-Based) — ليست نموذج ذكاء اصطناعي حقيقي في هذه المرحلة</p>

  <div class="grid lg:grid-cols-2 gap-5 mb-7">

    <div class="card p-5">
      <p class="font-bold text-sm mb-3">مؤشرات عامة</p>
      <div class="grid grid-cols-2 gap-3 text-sm">
        <div class="p-3 rounded-lg" style="background:var(--paper)"><p class="text-lg font-bold">${closureRate}%</p><p class="text-xs" style="color:var(--muted)">نسبة إغلاق البلاغات</p></div>
        <div class="p-3 rounded-lg" style="background:var(--paper)"><p class="text-lg font-bold">${avgRating}</p><p class="text-xs" style="color:var(--muted)">متوسط تقييم الخدمة</p></div>
      </div>
      <p class="field-label mt-4 mb-2">متوسط زمن الإصلاح حسب النوع (ساعة)</p>
      <div class="space-y-1.5">
        ${PROBLEM_TYPES.map(t=>repairByType[t.key]!==null?`<div class="flex justify-between text-xs"><span>${t.label}</span><span class="font-semibold">${repairByType[t.key].toFixed(1)} س</span></div>`:'').join('')}
      </div>
    </div>
  </div>

  <div class="grid lg:grid-cols-2 gap-5 mb-7">
    <div class="card p-5">
      <p class="font-bold text-sm mb-3">الأجهزة الأكثر أعطالًا</p>
      ${topDevices.length? topDevices.map(([id,count])=>{
        const dev = DataService.getDevice(id);
        const lastClosed = reports.filter(r=>r.deviceId===id && r.closedAt).sort((a,b)=>new Date(b.closedAt)-new Date(a.closedAt))[0];

          <div class="text-left"><p class="font-bold text-sm">${count}</p>${count>=4?'<span class="chip pill-overdue text-[10px]">يحتاج مراجعة</span>':''}</div>
        </div>`;

window.onExPeriodChange = function(){
  const v = document.getElementById('ex-period').value;
  const show = v === 'custom';
  document.getElementById('ex-from-wrap').classList.toggle('hidden', !show);
  document.getElementById('ex-to-wrap').classList.toggle('hidden', !show);
};
function periodRange(){
  const v = document.getElementById('ex-period').value;
  const now = new Date();
  if(v==='month'){ return [new Date(now.getFullYear(), now.getMonth(), 1), new Date(now.getFullYear(), now.getMonth()+1, 0, 23,59,59)]; }
  if(v==='lastmonth'){ return [new Date(now.getFullYear(), now.getMonth()-1, 1), new Date(now.getFullYear(), now.getMonth(), 0, 23,59,59)]; }
  if(v==='custom'){
    const f = document.getElementById('ex-from').value, t = document.getElementById('ex-to').value;
    if(!f||!t){ toast('اختر تاريخ البداية والنهاية'); return null; }
    return [new Date(f), new Date(t+'T23:59:59')];
  }
  return [new Date(2000,0,1), new Date(2100,0,1)];
}
window.exportExcel = async function(){
  const range = periodRange();
  if(!range) return;
  const [from, to] = range;
  const s = DataService.state;
  const list = s.reports.filter(r=>{ const d = new Date(r.createdAt); return d>=from && d<=to; });
  if(!list.length){ toast('لا توجد بيانات ضمن الفترة المحددة'); return; }
  const rows = list.map(r=>({
    'رقم البلاغ': r.number,
    'التاريخ': fmtDateShort(r.createdAt),
    'الموقع': DataService.locationLabel(r.locationId),
    'نوع المشكلة': typeLabel(r.type),
    'الأولوية': prLabel(r.priority),
    'الحالة': stLabel(r.status),
    'الفني': r.technicianId ? DataService.getTech(r.technicianId).name : '—',
    'بداية الصيانة': r.startedAt ? fmtDate(r.startedAt) : '—',
    'انتهاء الصيانة': r.resolvedAt ? fmtDate(r.resolvedAt) : '—',
    'مدة المعالجة (ساعة)': r.closedAt ? hoursBetween(r.createdAt, r.closedAt).toFixed(1) : '—',
    'ملاحظات الصيانة': r.notes.map(n=>n.text).join(' | '),
    'تقييم المستخدم': r.rating!==null ? r.rating : '—',
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'البلاغات');
  const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const blob = new Blob([wbout], {type:'application/octet-stream'});
  const fname = 'smart-qr-maintenance-reports-' + fmtDateShort(from.toISOString()).replaceAll('/','-') + '.xlsx';
  await offerDownload(blob, fname);
};

function destroyChart(id){ if(CHARTS[id]){ CHARTS[id].destroy(); delete CHARTS[id]; } }
function renderDashboardCharts(){
  const s = DataService.state;

  if(typeCanvas){

      data:{ labels: PROBLEM_TYPES.map(t=>t.label), datasets:[{ data: PROBLEM_TYPES.map(t=>counts[t.key]),

      options:{ plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:10}, color: getComputedStyle(document.body).color}}}, maintainAspectRatio:true }
    });
  }
  const statusCanvas = document.getElementById('chart-status');
  if(statusCanvas){
    const counts = {}; STATUSES.forEach(t=>counts[t.key]=0);
    s.reports.forEach(r=>counts[r.status] = (counts[r.status]||0)+1);
    destroyChart('chart-status');
    CHARTS['chart-status'] = new Chart(statusCanvas, {

      options:{ plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true, ticks:{precision:0}}, x:{grid:{display:false}} } }

  if(locCanvas){
    const counts = {};

/* ---------------------------- render hooks -------------------------------- */
const _origDispatch = View.dispatch;
View.dispatch = function(parts, query){
  const html = _origDispatch(parts, query);
  const p0 = parts[0];
  if(p0==='admin' && !parts[1]) View.afterRender = renderDashboardCharts;
  else if(p0==='admin' && parts[1]==='analytics') View.afterRender = renderDashboardCharts;
  else if(p0==='admin' && parts[1]==='qr') View.afterRender = View._afterAdminQr;
  else if(p0==='admin' && parts[1]==='settings') View.afterRender = renderPushStatus;
  else if((p0==='admin'||p0==='technician'||p0==='employee') && parts[1]==='report') View.afterRender = View._afterReportDetails;
  else if(p0==='login') View.afterRender = View._afterLogin;
  return html;
};

/* ---------------------------- push notifications (admin) ---------------- */
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
async function ensureServiceWorker(){
  if(!('serviceWorker' in navigator)) return null;
  try{ return await navigator.serviceWorker.register('/sw.js'); }
  catch(e){ console.error('sw registration failed', e); return null; }
}
window.enablePushUi = async function(){
  if(!('Notification' in window) || !('PushManager' in window)){
    toast('المتصفح الحالي لا يدعم الإشعارات الفورية');
    return;
  }
  try{
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){ toast('تم رفض إذن الإشعارات من إعدادات المتصفح'); renderPushStatus(); return; }
    const reg = await ensureServiceWorker();
    if(!reg) throw new Error('service worker unavailable');
    const { publicKey } = await apiRequest('/push/vapid-public-key');
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(publicKey) });
    }
    await apiRequest('/push/subscribe', { method:'POST', body: sub.toJSON() });
    toast('تم تفعيل الإشعارات الفورية على هذا الجهاز');
  }catch(e){ toast('تعذّر تفعيل الإشعارات: ' + e.message); }
  renderPushStatus();
};
window.disablePushUi = async function(){
  try{
    const reg = await ensureServiceWorker();
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    if(sub){
      await apiRequest('/push/unsubscribe', { method:'POST', body:{ endpoint: sub.endpoint } });
      await sub.unsubscribe();
    }
    toast('تم إيقاف الإشعارات الفورية على هذا الجهاز');
  }catch(e){ toast('تعذّر إيقاف الإشعارات: ' + e.message); }
  renderPushStatus();
};
async function renderPushStatus(){
  const wrap = document.getElementById('push-status-wrap');
  if(!wrap) return;
  if(!('Notification' in window) || !('PushManager' in window) || !('serviceWorker' in navigator)){
    wrap.innerHTML = '<p class="text-xs" style="color:var(--muted)">هذا المتصفح لا يدعم الإشعارات الفورية.</p>';
    return;
  }
  if(Notification.permission === 'denied'){
    wrap.innerHTML = '<p class="text-xs" style="color:var(--overdue)">تم حظر الإشعارات من إعدادات المتصفح لهذا الموقع — فعّلها يدويًا من إعدادات الموقع بالمتصفح ثم أعد تحميل الصفحة.</p>';
    return;
  }
  let subscribed = false;
  try{
    const reg = await navigator.serviceWorker.getRegistration('/sw.js');
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    subscribed = !!sub;
  }catch(e){}
  wrap.innerHTML = subscribed
    ? '<button onclick="disablePushUi()" class="btn btn-ghost text-sm">إيقاف الإشعارات على هذا الجهاز</button>'
    : '<button onclick="enablePushUi()" class="btn btn-primary text-sm">تفعيل الإشعارات على هذا الجهاز</button>';
}
async function maybeAutoResubscribePush(){
  try{
    const u = currentUser();
    if(!u || u.role!=='admin') return;
    if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
    if(Notification.permission !== 'granted') return;
    const reg = await ensureServiceWorker();
    if(!reg) return;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      const { publicKey } = await apiRequest('/push/vapid-public-key');
      sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(publicKey) });
    }
    // Re-announce the subscription every load — cheap, and self-heals the
    // in-memory backend list after a server restart.
    await apiRequest('/push/subscribe', { method:'POST', body: sub.toJSON() });
  }catch(e){ /* best-effort, never interrupts the app */ }
}

/* ---------------------------- boot ---------------------------------------- */
(async function boot(){
  const app = document.getElementById('app');
  app.innerHTML = '<div class="flex items-center justify-center py-24 text-sm" style="color:var(--muted)">جارٍ الاتصال بالخادم...</div>';
  try{
    await DataService.init();
    Router.render();
    maybeAutoResubscribePush();
  }catch(e){
    console.error(e);
    app.innerHTML = '<div class="max-w-md mx-auto text-center py-24">'
      + '<p class="text-sm mb-4" style="color:var(--overdue)">تعذّر الاتصال بخادم النظام (Backend). تأكد من تشغيل الخادم ثم أعد تحميل الصفحة.</p>'
      + '<button onclick="location.reload()" class="btn btn-primary">إعادة المحاولة</button>'
      + '</div>';
  }
})();
